id = "xzedx.derby"
name = "Derby"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Send one prompt to every coding agent in the current Herdr tab and watch them race: a popup to type in, live timers and finishing ranks on the pane borders."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# Opens the broadcast popup on the current tab, sized to its agent count.
[[actions]]
id = "broadcast"
title = "Derby: broadcast a prompt to this tab's agents"
contexts = ["workspace", "global"]
command = ["./target/release/herdr-derby", "--open"]

[[panes]]
id = "broadcast"
title = "Derby"
placement = "popup"
width = 76
height = 16
command = ["./target/release/herdr-derby"]

# Race mode: start fresh agents, each in its own lane, and race them.
[[actions]]
id = "race"
title = "Derby: race fresh agents on one prompt"
contexts = ["workspace", "global"]
command = ["./target/release/herdr-derby", "--open-race"]

# Keep the winning lane of the latest race, remove the others.
[[actions]]
id = "settle"
title = "Derby: settle the latest race"
contexts = ["workspace", "global"]
command = ["./target/release/herdr-derby", "--open-settle"]

[[panes]]
id = "race"
title = "Derby race"
placement = "popup"
width = 76
height = 22
command = ["./target/release/herdr-derby", "--race-popup"]

[[panes]]
id = "settle"
title = "Derby settle"
placement = "popup"
width = "90%"
height = "80%"
command = ["./target/release/herdr-derby", "--settle-popup"]
